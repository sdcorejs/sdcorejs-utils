name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required to mint the OIDC token that npm trusted publishing exchanges for
      # short-lived credentials. Without it npm sees an unauthenticated PUT and
      # answers 404 rather than 401, which reads like a missing package.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # registry-url is deliberately omitted: setup-node would write an .npmrc
      # carrying _authToken, and that credential shadows the OIDC exchange.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Node 22 ships npm 10, which cannot do trusted publishing.
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version
          publish: npm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
